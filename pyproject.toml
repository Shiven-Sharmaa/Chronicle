[project]
name = "chronicle-ai"
version = "0.1.0"
description = "The real edit history for AI-assisted repos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "watchdog>=4.0",
    "psutil>=5.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
chronicle = "chronicle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
